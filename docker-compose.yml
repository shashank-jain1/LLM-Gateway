version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm-gateway-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      # Persist configuration changes made via the admin panel
      - ./backend/config.yaml:/app/config.yaml
    environment:
      - PORT=8001
      - LLM_GATEWAY_CONFIG=config.yaml
      - LOG_LEVEL=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm-gateway-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      # Tell Next.js Server to communicate with the FastAPI backend via the local docker network
      - LLM_GATEWAY_BACKEND_URL=http://backend:8001
      # Database connection string (e.g. Supabase Postgres)
      - DATABASE_URL=postgresql://postgres:Supabase.ss@db.vylqgtxblwxuklgohoqw.supabase.co:5432/postgres
