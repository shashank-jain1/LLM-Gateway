version: "3.8"

services:
  llm-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: llm-gateway
    ports:
      - "8000:8000"
    volumes:
      - ../backend/config.yaml:/app/config.yaml:ro
    environment:
      - LLM_GATEWAY_CONFIG=/app/config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
