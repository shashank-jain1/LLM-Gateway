gateway:
  api_keys:
  - sk-gateway-mysecretkey123
  port: 8001
  host: 0.0.0.0
  default_cooldown_seconds: 30.0
  max_cooldown_seconds: 600.0
  request_timeout_seconds: 60.0
  log_level: info
providers:
- id: openai-primary
  enabled: true
  priority: 1
